name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Verify
        run: npm run verify

      - name: Build unpacked extension
        run: npm run build

      - name: Build development extension
        run: npm run build:dev

      - name: Package release ZIP
        run: npm run package
