<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Dev reload: allow local network access</title>
    <style>
      body {
        font:
          15px/1.5 system-ui,
          sans-serif;
        max-width: 34rem;
        margin: 3rem auto;
        padding: 0 1rem;
      }
      code {
        background: #8882;
        padding: 0 0.3em;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>Allow dev reload</h1>
    <p>
      <code>npm run dev</code> reloads this extension over <code>127.0.0.1</code>. The browser must grant this extension
      <b>local network access</b> once; extension workers cannot ask for it themselves, so this page does. Click
      <b>Allow</b> on the browser prompt.
    </p>
    <p id="status">Contacting the dev server…</p>
    <script src="dev-connect.js"></script>
  </body>
</html>
